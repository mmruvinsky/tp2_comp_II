<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apagado ordenado</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo · TP2 Computación II</p>
    <h1>Apagado ordenado con SIGTERM / SIGINT</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apagado-title apagado-desc">
        <title id="apagado-title">Apagado ordenado con SIGTERM o SIGINT</title>
        <desc id="apagado-desc">Al llegar SIGTERM o SIGINT el servicio rechaza los POST con 503, no arranca las tareas encoladas, espera hasta 8 segundos a las que corren, cancela las que no terminaron, cierra workers, sesión y executor, vuelca el estado a estado_timestamp.json y termina.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- FLECHAS -->
        <line x1="400" y1="88" x2="400" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="176" x2="400" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="264" x2="400" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="352" x2="400" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="480" x2="400" y2="524" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="520" y1="432" x2="600" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 720,460 V 520 Q 720,528 712,528 H 404" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="400" y1="532" x2="400" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="616" x2="400" y2="648" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="400" y1="704" x2="400" y2="736" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- ETIQUETAS -->
        <rect x="372" y="496" width="16" height="12" rx="2" fill="#f5f5f5"/><text x="380" y="505" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SÍ</text>
        <rect x="552" y="412" width="16" height="12" rx="2" fill="#f5f5f5"/><text x="560" y="421" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <!-- NODOS -->
        <rect x="280" y="40" width="240" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/><text x="400" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Llega SIGTERM o SIGINT</text><text x="400" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">add_signal_handler</text>
        <rect x="272" y="120" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="145" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dejar de aceptar tareas</text><text x="400" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST: 503 · los GET siguen andando</text>
        <rect x="272" y="208" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="233" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Las encoladas no arrancan</text><text x="400" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quedan pendiente en el volcado</text>
        <rect x="272" y="296" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="321" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Esperar las que están en curso</text><text x="400" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cola.join() · límite de 8 s</text>
        <polygon points="400,384 520,432 400,480 280,432" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Terminaron a tiempo?</text>
        <rect x="600" y="404" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="720" y="429" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cancelar las que quedan</text><text x="720" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task.cancel() · motivo: apagado</text>
        <circle cx="400" cy="528" r="4" fill="#2d3142"/>
        <rect x="272" y="560" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="585" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cerrar workers, sesión y executor</text><text x="400" y="602" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sin corrutinas huérfanas</text>
        <rect x="272" y="648" width="256" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="400" y="673" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Volcar el estado a JSON</text><text x="400" y="690" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">estado_&lt;timestamp&gt;.json</text>
        <rect x="280" y="736" width="240" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/><text x="400" y="758" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Termina el proceso</text><text x="400" y="774" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exit 0 · el contenedor se detiene</text>
        <!-- ANOTACIONES -->
        <text x="936" y="64" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">Docker le manda la señal al PID 1: Python, por la forma exec.</text><text x="936" y="82" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">Si no termina en 15 s (stop_grace_period), llega SIGKILL.</text>
        <path d="M 590,66 H 524" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="522" cy="66" r="2" fill="#2d3142"/>
        <text x="936" y="672" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">Al volver a arrancar, el volcado previo se reporta</text><text x="936" y="690" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">por log. Sus pendientes no se retoman.</text>
        <path d="M 650,676 H 532" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="530" cy="676" r="2" fill="#2d3142"/>
        <line x1="24" y1="816" x2="936" y2="816" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="834" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
        <g font-family="'Geist', sans-serif" font-size="8.5" fill="#4f5d75">
        <rect x="24" y="850" width="22" height="10" rx="5" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="52" y="858">Inicio / fin</text>
        <rect x="137" y="850" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="157" y="858">Paso</text>
        <polygon points="212,848 220,855 212,862 204,855" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="228" y="858">Decisión</text>
        <circle cx="299" cy="855" r="4" fill="#2d3142"/>
        <text x="310" y="858">Unión de caminos</text>
        <rect x="414" y="850" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="434" y="858">Paso que exige la consigna como salida</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
