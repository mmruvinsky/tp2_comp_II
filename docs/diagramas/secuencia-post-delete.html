<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secuencia POST y DELETE</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · TP2 Computación II</p>
    <h1>Encargar una tarea y cancelarla en ejecución</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secuencia-title secuencia-desc">
        <title id="secuencia-title">Encargar una tarea y cancelarla en ejecución</title>
        <desc id="secuencia-desc">El cliente hace POST, la API encola el id y responde enseguida con el id y estado pendiente; un worker toma el id de la cola y ejecuta la tarea; más tarde el cliente hace DELETE, la API cancela la tarea en curso, el worker recibe CancelledError y limpia, y el cliente recibe el estado cancelada.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- LÍNEAS DE VIDA -->
        <line x1="120" y1="104" x2="120" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="360" y1="104" x2="360" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="600" y1="104" x2="600" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="104" x2="840" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- BARRAS DE ACTIVACIÓN -->
        <rect x="356" y="148" width="8" height="84" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="836" y="268" width="8" height="236" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="356" y="388" width="8" height="124" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Marca de tiempo -->
        <text x="24" y="368" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MÁS TARDE</text>

        <!-- MENSAJES -->
        <!-- 1 POST -->
        <line x1="120" y1="152" x2="356" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 2 put -->
        <line x1="364" y1="184" x2="600" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3 respuesta inmediata (titular) -->
        <line x1="356" y1="224" x2="120" y2="224" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 4 get -->
        <line x1="600" y1="272" x2="836" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5 ejecuta (auto-mensaje) -->
        <path d="M 844,304 H 880 V 336 H 844" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 6 DELETE -->
        <line x1="120" y1="392" x2="356" y2="392" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 7 cancel -->
        <line x1="364" y1="432" x2="836" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 8 CancelledError (auto-mensaje) -->
        <path d="M 844,460 H 880 V 492 H 844" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 9 respuesta DELETE -->
        <line x1="356" y1="508" x2="120" y2="508" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ETIQUETAS -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#4f5d75">
          <rect x="200" y="132" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="238" y="141" fill="#2e5aa8">POST /TAREAS</text>
          <rect x="458" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="482" y="173">PUT(ID)</text>
          <rect x="196" y="204" width="84" height="12" rx="2" fill="#f5f5f5"/>
          <text x="238" y="213" fill="#bf4520">ID · PENDIENTE</text>
          <rect x="686" y="252" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="718" y="261">GET() → ID</text>
          <rect x="888" y="314" width="80" height="12" rx="2" fill="#f5f5f5"/>
          <text x="928" y="323">EJECUTA TAREA</text>
          <rect x="200" y="372" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="238" y="381" fill="#2e5aa8">DELETE /{ID}</text>
          <rect x="456" y="412" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="482" y="421">CANCEL()</text>
          <rect x="888" y="470" width="84" height="12" rx="2" fill="#f5f5f5"/>
          <text x="930" y="479">CANCELLEDERROR</text>
          <rect x="208" y="488" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="238" y="497">CANCELADA</text>
        </g>

        <!-- ACTORES -->
        <!-- Cliente (input) -->
        <rect x="40" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="48" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="54" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="63" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="120" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cliente</text>
        <text x="120" y="95" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl</text>

        <!-- API (backend) -->
        <rect x="280" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="288" y="54" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="302" y="63" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="360" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API FastAPI</text>
        <text x="360" y="95" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoints async</text>

        <!-- Cola (store) -->
        <rect x="520" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="48" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="528" y="54" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="544" y="63" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COLA</text>
        <text x="600" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cola</text>
        <text x="600" y="95" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">asyncio.Queue</text>

        <!-- Worker (backend) -->
        <rect x="760" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="768" y="54" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="784" y="63" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
        <text x="840" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
        <text x="840" y="95" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 de los N</text>

        <!-- LEYENDA -->
        <line x1="40" y1="560" x2="960" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
        <g font-family="'Geist', sans-serif" font-size="8.5" fill="#4f5d75">
          <rect x="40" y="590" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="52" y="602">Activo (tiene el control)</text>
          <line x1="200" y1="600" x2="228" y2="600" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <text x="236" y="602">Pedido HTTP</text>
          <line x1="336" y1="600" x2="364" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="372" y="602">Llamada interna</text>
          <line x1="484" y1="600" x2="512" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text x="520" y="602">Respuesta</text>
          <line x1="612" y1="600" x2="640" y2="600" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
          <text x="648" y="602">Respuesta inmediata del POST</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
