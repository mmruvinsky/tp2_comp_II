<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura TP2</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · TP2 Computación II</p>
    <h1>Plataforma de tareas: componentes y flujo de una tarea</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1120 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc">
        <title id="arquitectura-title">Plataforma de tareas: componentes y flujo</title>
        <desc id="arquitectura-desc">El cliente encarga tareas por HTTP a la API FastAPI, que las registra y las encola en una asyncio.Queue; un pool de workers las consume, descarga de Internet sin salir del event loop y manda el hasheo a un executor fuera del loop; al apagar, el registro se vuelca a un JSON.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ZONAS -->
        <rect x="200" y="72" width="656" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="216" y="76" width="232" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="85" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROCESO PYTHON · EVENT LOOP · 1 HILO</text>

        <rect x="888" y="272" width="224" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="904" y="276" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="962" y="285" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FUERA DEL LOOP</text>

        <!-- FLECHAS (antes que los nodos) -->
        <!-- Cliente -> API -->
        <line x1="160" y1="152" x2="248" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- API -> Cliente (respuesta inmediata) -->
        <line x1="248" y1="176" x2="160" y2="176" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- API -> Cola -->
        <line x1="416" y1="164" x2="480" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Cola -> Workers -->
        <line x1="624" y1="164" x2="680" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Workers -> Internet -->
        <line x1="832" y1="164" x2="904" y2="164" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- API -> Registro -->
        <line x1="332" y1="200" x2="332" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Workers -> Registro -->
        <path d="M 712,200 V 332 Q 712,340 704,340 H 416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Workers -> Executor -->
        <path d="M 800,200 V 332 Q 800,340 808,340 H 904" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Executor -> Workers (resultado) -->
        <path d="M 904,364 H 784 Q 776,364 776,356 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Registro -> Volcado JSON -->
        <line x1="248" y1="340" x2="160" y2="340" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ETIQUETAS DE FLECHAS -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#5a6580">
          <rect x="188" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="204" y="141" fill="#2e5aa8">HTTP</text>
          <rect x="170" y="184" width="68" height="12" rx="2" fill="#f5f5f5"/>
          <text x="204" y="193">ID + ESTADO</text>
          <rect x="424" y="144" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="448" y="153">PUT(ID)</text>
          <rect x="634" y="144" width="36" height="12" rx="2" fill="#f5f5f5"/>
          <text x="652" y="153">GET()</text>
          <rect x="838" y="144" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="868" y="153" fill="#2e5aa8">DESCARGAR</text>
          <rect x="340" y="246" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="372" y="255">CREA / LEE</text>
          <rect x="528" y="320" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="560" y="329">SET ESTADO</text>
          <rect x="816" y="320" width="80" height="12" rx="2" fill="#f5f5f5"/>
          <text x="856" y="329" fill="#bf4520">HASHEAR (CPU)</text>
          <rect x="814" y="372" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="844" y="381">RESULTADO</text>
          <rect x="180" y="320" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="204" y="329">SIGTERM</text>
        </g>

        <!-- NODOS -->
        <!-- Cliente (input) -->
        <rect x="24" y="128" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="24" y="128" width="136" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="32" y="134" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="46" y="143" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="92" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cliente HTTP</text>
        <text x="92" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl / navegador</text>

        <!-- API (backend) -->
        <rect x="248" y="128" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="128" width="168" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="256" y="134" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="270" y="143" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="332" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API FastAPI</text>
        <text x="332" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uvicorn · 0.0.0.0:8000</text>

        <!-- Cola (focal) -->
        <rect x="480" y="128" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="128" width="144" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="488" y="134" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="504" y="143" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COLA</text>
        <text x="552" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cola de tareas</text>
        <text x="552" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">asyncio.Queue</text>

        <!-- Pool de workers (backend) -->
        <rect x="680" y="128" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="128" width="152" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="688" y="134" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="704" y="143" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
        <text x="756" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pool de workers</text>
        <text x="756" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">N corrutinas</text>

        <!-- Registro (store) -->
        <rect x="248" y="304" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="304" width="168" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="256" y="310" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="270" y="319" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
        <text x="332" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registro de tareas</text>
        <text x="332" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dict id → tarea</text>

        <!-- Volcado JSON (store) -->
        <rect x="24" y="304" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="24" y="304" width="136" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="32" y="310" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="48" y="319" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="92" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Volcado</text>
        <text x="92" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">estado_&lt;ts&gt;.json</text>

        <!-- Internet (external) -->
        <rect x="904" y="128" width="192" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="904" y="128" width="192" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="912" y="134" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="926" y="143" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="1000" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Internet (URLs)</text>
        <text x="1000" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aiohttp o httpx · a decidir</text>

        <!-- Executor (focal) -->
        <rect x="904" y="304" width="192" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="904" y="304" width="192" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="912" y="310" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="926" y="319" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CPU</text>
        <text x="1000" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Executor</text>
        <text x="1000" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Thread o Process · a decidir</text>

        <!-- LEYENDA -->
        <line x1="24" y1="428" x2="1096" y2="428" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
        <g font-family="'Geist', sans-serif" font-size="8.5" fill="#4f5d75">
          <rect x="24" y="462" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="44" y="470">Pieza clave</text>
          <rect x="164" y="462" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <text x="184" y="470">Estado / archivo</text>
          <rect x="316" y="462" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="336" y="470">Externo</text>
          <line x1="436" y1="467" x2="464" y2="467" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <text x="472" y="470">HTTP / red (I/O-bound)</text>
          <line x1="612" y1="467" x2="640" y2="467" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
          <text x="648" y="470">Trabajo CPU-bound</text>
          <line x1="772" y1="467" x2="800" y2="467" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="808" y="470">Llamada interna</text>
          <line x1="924" y1="467" x2="952" y2="467" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text x="960" y="470">Respuesta / evento</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
