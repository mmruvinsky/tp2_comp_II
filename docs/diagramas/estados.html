<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados de tarea</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Máquina de estados · TP2 Computación II</p>
    <h1>Ciclo de vida de una tarea</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estados-title estados-desc">
        <title id="estados-title">Ciclo de vida de una tarea</title>
        <desc id="estados-desc">Una tarea nace pendiente con el POST, pasa a ejecutando cuando un worker saca su id de la cola y termina en completada, en fallida por error o timeout, o en cancelada por un DELETE o por el límite del apagado; las que siguen en cola al apagar quedan pendiente en el volcado.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="188" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CAMINO NORMAL</text>
        <rect x="24" y="344" width="912" height="128" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="364" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FINALES SIN ÉXITO</text>
        <!-- TRANSICIONES -->
        <line x1="46" y1="236" x2="128" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="296" y1="236" x2="408" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="576" y1="236" x2="712" y2="236" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 212,272 V 412 Q 212,420 220,420 H 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 464,272 V 412 Q 464,420 456,420 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 520,272 V 412 Q 520,420 528,420 H 616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- ETIQUETAS -->
        <rect x="74" y="216" width="26" height="12" rx="2" fill="#f5f5f5"/><text x="87" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST</text>
        <rect x="322" y="216" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="352" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE.GET()</text>
        <rect x="616" y="216" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="644" y="225" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TERMINA OK</text>
        <rect x="224" y="300" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="242" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELETE</text>
        <rect x="380" y="300" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="418" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELETE/APAGADO</text>
        <rect x="533" y="300" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="568" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ERROR/TIMEOUT</text>
        <circle cx="40" cy="236" r="6" fill="#2d3142"/>
        <!-- ESTADOS -->
        <rect x="128" y="200" width="168" height="72" rx="8" fill="#f5f5f5"/><rect x="128" y="200" width="168" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pendiente</text><text x="212" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">su id espera en la cola</text>
        <rect x="408" y="200" width="168" height="72" rx="8" fill="#f5f5f5"/><rect x="408" y="200" width="168" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="492" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ejecutando</text><text x="492" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">corre en su propia Task</text>
        <rect x="712" y="200" width="168" height="72" rx="8" fill="#f5f5f5"/><rect x="712" y="200" width="168" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><rect x="720" y="208" width="36" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/><text x="738" y="217" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text><text x="796" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">completada</text><text x="796" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">resultado guardado</text>
        <rect x="272" y="384" width="168" height="72" rx="8" fill="#f5f5f5"/><rect x="272" y="384" width="168" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/><rect x="280" y="392" width="36" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/><text x="298" y="401" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text><text x="356" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cancelada</text><text x="356" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cliente o apagado</text>
        <rect x="616" y="384" width="168" height="72" rx="8" fill="#f5f5f5"/><rect x="616" y="384" width="168" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="624" y="392" width="36" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/><text x="642" y="401" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text><text x="700" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fallida</text><text x="700" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">con el motivo</text>
        <!-- ANOTACIONES -->
        <text x="120" y="132" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">Al apagar, las encoladas no arrancan:</text><text x="120" y="150" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">quedan pendiente en el volcado.</text>
        <path d="M 212,156 V 196" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="212" cy="198" r="2" fill="#2d3142"/>
        <text x="500" y="132" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">Al salir de ejecutando, el estado final lo fija</text><text x="500" y="150" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">un único done callback. DELETE sobre un final: 409.</text>
        <path d="M 492,156 V 196" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="492" cy="198" r="2" fill="#2d3142"/>
        <line x1="24" y1="492" x2="936" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="510" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
        <g font-family="'Geist', sans-serif" font-size="8.5" fill="#4f5d75">
        <circle cx="29" cy="531" r="5" fill="#2d3142"/>
        <text x="40" y="534">Inicio</text>
        <rect x="96" y="526" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="116" y="534">Estado intermedio</text>
        <rect x="224" y="526" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="244" y="534">Final con éxito</text>
        <rect x="343" y="526" width="14" height="10" rx="2" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text x="363" y="534">Final sin éxito</text>
        <line x1="462" y1="531" x2="490" y2="531" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="498" y="534">Transición (evento que la dispara)</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
